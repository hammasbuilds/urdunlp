[project]
# Published as `urdunlp`, which is also the import name - `pip install urdunlp`
# then `import urdunlp`, with no translation step. `urdu-nlp-toolkit` overclaims:
# this is normalisation and tokenisation, not a comprehensive toolkit, and
# `urdu-nlp` already exists on PyPI with nearly the same pitch. The GitHub repo
# keeps its name; only the distribution name changes.
name = "urdunlp"
version = "0.2.0"
description = "Urdu and Roman Urdu text processing: normalisation, transliteration scored against human romanisations, language identification, numbers, stemming. Pure Python, no dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["urdu", "roman-urdu", "nlp", "transliteration", "normalization", "language-identification", "code-mixing", "stemmer", "pakistan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Urdu",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # Listed one by one so PyPI's sidebar shows what is supported. Every version
    # here is exercised by CI on both Linux and Windows; the claim is tested, not
    # asserted.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# No dependencies. Deliberate: this is the layer everything else sits on, and a
# dependency here becomes a dependency of every Urdu project that uses it.
dependencies = []

[project.urls]
Homepage = "https://github.com/hammasbuilds/urdunlp"
Issues = "https://github.com/hammasbuilds/urdunlp/issues"
Source = "https://github.com/hammasbuilds/urdunlp"
Changelog = "https://github.com/hammasbuilds/urdunlp/releases"
"Corpus measurements" = "https://github.com/hammasbuilds/urdunlp/blob/main/docs/CORPUS.md"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urdunlp"]
# py.typed has no extension and is empty, so it is exactly the kind of file a
# build backend drops. Without it in the wheel, mypy and pyright ignore every
# annotation in this package and callers get `Any` back from a fully typed
# library - PEP 561 requires the marker to be shipped, not just the hints.
# The three .json.gz files are the bundled models (1 MB together); listed for the
# same reason - a wheel that imports and then fails on first use is worse than
# one that fails to build.
artifacts = ["src/urdunlp/py.typed", "src/urdunlp/data/*.json.gz"]

[tool.hatch.build.targets.sdist]
# The sdist should carry everything needed to rebuild and verify, which means the
# tests and the corpus measurement script, not only the importable package.
include = [
    "src/urdunlp",
    "tests",
    "scripts",
    "docs",
    "conftest.py",
    "demo.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
