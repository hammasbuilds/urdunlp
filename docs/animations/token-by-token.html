<script type="application/json" id="spec">{"id": "token-by-token", "repo": "urdunlp", "project": "urdunlp", "kind": "architecture", "title": "Six words, six decisions", "subtitle": "Which part of the model decided each one, and why", "accent": "#6fcf97", "input": {"label": "Roman Urdu, as people type it", "text": "Rashid ko pandrah hazaar bhej do"}, "output": {"label": "Urdu script", "text": "راشد کو پندرہ ہزار بھیج دو"}, "intro_text": "Every word here was decided by a different part of the decoder, and the library will tell you which - so a caller can separate a certainty from a guess.", "summary": "One word is taken outright from the curated lexicon. The other five are spelled out by the letter tables into candidates, then settled by the vocabulary prior and the bigram model. The provenance of each is reported, and two of the words also carry the amount.", "facts": "91.3% word accuracy - 54.5% back exactly as the annotator wrote it", "footer": "github.com/hammasbuilds/urdunlp", "nodes": [{"id": "tag", "label": "Script check", "icon": "🔎", "sub": "Roman or already Urdu", "role": "api", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "lex", "label": "Lexicon", "icon": "📒", "sub": "305 curated entries", "role": "store", "kind": "block", "x": 4.5, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "cand", "label": "Letter model", "icon": "🔤", "sub": "224 contexts", "role": "model", "kind": "block", "x": 9.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "pick", "label": "Vocabulary + LM", "icon": "⚖️", "sub": "prior + bigram", "role": "core", "kind": "block", "x": 13.5, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "prov", "label": "Provenance", "icon": "🧾", "sub": "which stage decided", "role": "guard", "kind": "block", "x": 13.5, "y": 4.5, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "num", "label": "Numbers", "icon": "🔢", "sub": "across two words", "role": "tool", "kind": "block", "x": 9.0, "y": 4.5, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{" a": ["pick>prov"], "packet": "reported per word", "title": "Provenance", "text": "Report the stage that decided each word, so a caller can tell a dictionary hit from a statistical guess.", "data": "transliterate_with_confidence()", "dur": 3.4, "travel": 0.9, "inset": {"kind": "tokens", "title": "Provenance: every token", "items": ["Rashid = vocabulary", "ko = lexicon", "pandrah = vocabulary", "hazaar = vocabulary", "bhej = vocabulary", "do = vocabulary"], "note": ""}}, {"node": "num", "via": ["prov>num"], "packet": "15,000", "title": "Numbers", "text": "Read the quantity across the words that carry it.", "data": "find_numbers()", "dur": 3.4, "travel": 0.9, "inset": {"kind": "tokens", "title": "Numbers: every token", "items": ["Rashid ·", "ko ·", "pandrah = 15", "hazaar = x 1,000", "bhej ·", "do ·"], "note": ""}}], "insets": true}</script>
