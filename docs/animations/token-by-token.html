<script type="application/json" id="spec">{"id": "token-by-token", "repo": "urdunlp", "project": "Transliteration", "kind": "architecture", "title": "Six words, six decisions", "subtitle": "Which part of the model decided each one, and why", "accent": "#6fcf97", "input": {"label": "Roman Urdu, as people type it", "text": "Rashid ko pandrah hazaar bhej do"}, "output": {"label": "Urdu script", "text": "راشد کو پندرہ ہزار بھیج دو"}, "intro_text": "Every word here was decided by a different part of the decoder, and the library will tell you which - so a caller can separate a certainty from a guess.", "summary": "One word is taken outright from the curated lexicon. The others are spelled out by the letter tables into candidates, then settled by the vocabulary prior and the bigram model, and the provenance of each is reported.", "facts": "91.3% word accuracy - 305 curated entries - 224 emission contexts", "footer": "github.com/hammasbuilds/urdunlp", "nodes": [{"id": "tag", "label": "Script check", "icon": "🔎", "sub": "Roman or Urdu", "role": "api", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "lex", "label": "Lexicon", "icon": "📒", "sub": "curated", "role": "store", "kind": "block", "x": 4.5, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "cand", "label": "Letter model", "icon": "🔤", "sub": "224 contexts", "role": "model", "kind": "block", "x": 9.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "pick", "label": "Vocabulary + LM", "icon": "⚖️", "sub": "prior + bigram", "role": "core", "kind": "block", "x": 13.5, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "prov", "label": "Provenance", "icon": "🧾", "sub": "which stage decided", "role": "guard", "kind": "block", "x": 13.5, "y": 4.5, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{"from": "tag", "to": "lex"}, {"from": "lex", "to": "cand"}, {"from": "cand", "to": "pick"}, {"from": "pick", "to": "prov"}], "steps": [{"node": "tag", "via": [], "packet": "6 Roman words", "title": "Script check", "text": "Roman to be read, already Urdu, or an identifier to leave alone.", "data": "tag_roman_tokens()", "dur": 3.4, "travel": 0.01, "inset": {"kind": "tokens", "title": "Script check: every token", "items": ["Rashid = ur", "ko = ur", "pandrah = ur", "hazaar = ur", "bhej = ur", "do = ur"], "note": ""}}, {"node": "lex", "via": ["tag>lex"], "packet": "1 settled", "title": "Lexicon", "text": "Taken outright and never overruled by context.", "data": "translit.LEXICON", "dur": 3.4, "travel": 0.9, "inset": {"kind": "tokens", "title": "Lexicon: every token", "items": ["Rashid ·", "ko = کو", "pandrah ·", "hazaar ·", "bhej ·", "do ·"], "note": "A word with a live second meaning does not belong here - khata is an account to a wallet and a fault in Wikipedia prose."}}, {"node": "cand", "via": ["lex>cand"], "packet": "5 candidates each", "title": "Letter model", "text": "Spell the rest out and keep the best few readings.", "data": "emission tables", "dur": 3.4, "travel": 0.9, "inset": {"kind": "tokens", "title": "Letter model: every token", "items": ["Rashid = رشید", "ko ·", "pandrah = پندرہ", "hazaar = ہزار", "bhej = بھیج", "do = دو"], "note": "On its own the first word reads رشید."}}, {"node": "pick", "via": ["cand>pick"], "packet": "one sentence", "title": "Vocabulary + LM", "text": "Prefer candidates that are real Urdu words and follow the word before.", "data": "noisy-channel decode", "dur": 3.4, "travel": 0.9, "inset": {"kind": "tokens", "title": "Vocabulary + LM: every token", "items": ["Rashid = راشد", "ko = کو", "pandrah = پندرہ", "hazaar = ہزار", "bhej = بھیج", "do = دو"], "note": "Which is how رشید becomes راشد here."}}, {"node": "prov", "via": ["pick>prov"], "packet": "reported per word", "title": "Provenance", "text": "So a caller can tell a dictionary hit from a statistical guess.", "data": "transliterate_with_confidence()", "dur": 3.4, "travel": 0.9, "inset": {"kind": "tokens", "title": "Provenance: every token", "items": ["Rashid = vocabulary", "ko = lexicon", "pandrah = vocabulary", "hazaar = vocabulary", "bhej = vocabulary", "do = vocabulary"], "note": ""}}], "insets": true}</script>
