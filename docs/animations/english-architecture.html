<script type="application/json" id="spec">{"id": "english-architecture", "repo": "urdunlp", "project": "Code-mixing", "kind": "architecture", "title": "Ten tokens, two vocabularies", "subtitle": "Which language each token belongs to", "accent": "#6fcf97", "input": {"label": "code-mixed chat", "text": "kal meeting cancel ho gayi plz 125 rupay bhej do"}, "output": {"label": "tagged", "text": "3 English of 10 tokens"}, "intro_text": "Three of these words are English, one is a number, and the rest are Urdu written in Latin letters. Only the Urdu should change script.", "summary": "Each token is tagged, then handled according to its tag - which is what stops 'meeting' becoming an Urdu word nobody would recognise.", "facts": "chat abbreviations like plz count as English", "footer": "github.com/hammasbuilds/urdunlp", "nodes": [{"id": "tok", "label": "Tokens", "icon": "✂️", "sub": "as typed", "role": "data", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "tag", "label": "Tag", "icon": "🏷", "sub": "which vocabulary", "role": "model", "kind": "block", "x": 4.5, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "act", "label": "Handled", "icon": "🔀", "sub": "by its tag", "role": "core", "kind": "block", "x": 9.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{"from": "tok", "to": "tag"}, {"from": "tag", "to": "act"}], "steps": [{"node": "tok", "via": [], "packet": "10", "title": "Tokens", "text": "The message, split.", "data": "words()", "dur": 3.4, "travel": 0.01, "inset": {"kind": "tokens", "title": "Tokens: every token", "items": ["kal = kal", "meeting = meeting", "cancel = cancel", "ho = ho", "gayi = gayi", "plz = plz", "125 = 125", "rupay = rupay", "bhej = bhej", "do = do"], "note": ""}}, {"node": "tag", "via": ["tok>tag"], "packet": "3 English", "title": "Tag", "text": "Urdu, English, a number, or an identifier.", "data": "tag_roman_tokens()", "dur": 3.4, "travel": 0.9, "inset": {"kind": "tokens", "title": "Tag: every token", "items": ["kal = ur", "meeting = en", "cancel = en", "ho = ur", "gayi = ur", "plz = en", "125 = num", "rupay = ur", "bhej = ur", "do = ur"], "note": "plz is English; rupay is Urdu; 125 is neither."}}, {"node": "act", "via": ["tag>act"], "packet": "mixed output", "title": "Handled", "text": "English kept in Latin, Urdu converted, numbers left alone.", "data": "keep_english=True", "dur": 3.4, "travel": 0.9, "inset": {"kind": "tokens", "title": "Handled: every token", "items": ["kal = converted", "meeting = kept", "cancel = kept", "ho = converted", "gayi = converted", "plz = kept", "125 = as-is", "rupay = converted", "bhej = converted", "do = converted"], "note": ""}}], "insets": true}</script>
