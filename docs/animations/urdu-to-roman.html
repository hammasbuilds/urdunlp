<script type="application/json" id="spec">{"id": "urdu-to-roman", "repo": "urdunlp", "project": "Urdu to Roman", "kind": "flow", "title": "Urdu script back into Roman", "subtitle": "Spelled the way people spell it, not letter by letter", "accent": "#6fcf97", "input": {"label": "Urdu script", "text": "میں کل لاہور سے آیا ہوں"}, "output": {"label": "Roman Urdu", "text": "main kal lahore se aaya hoon"}, "intro_text": "Going back is not the same problem. There is no single correct romanisation - the target is how a person would actually type the word.", "summary": "Each word is looked up among the romanisations people wrote for it; what is left is spelled by the letter rules. Scored two ways, because exact agreement with one annotator understates a task where several spellings are right.", "facts": "54.5% exactly as the annotator wrote it - 78.2% as some annotator did", "footer": "github.com/hammasbuilds/urdunlp", "nodes": [{"id": "norm", "label": "Normalise", "icon": "🧹", "sub": "one letter form", "role": "api", "kind": "block", "x": 0.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "look", "label": "Look up", "icon": "📒", "sub": "attested spellings", "role": "store", "kind": "block", "x": 4.5, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "rules", "label": "Letter rules", "icon": "🔤", "sub": "for the rest", "role": "model", "kind": "block", "x": 9.0, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}, {"id": "back", "label": "Round trip", "icon": "🔁", "sub": "and back again", "role": "guard", "kind": "block", "x": 13.5, "y": 0.0, "w": 2.3, "d": 2.3, "h": 1.3}], "edges": [{"from": "norm", "to": "look"}, {"from": "look", "to": "rules"}, {"from": "rules", "to": "back"}], "steps": [{"node": "norm", "via": [], "packet": "clean Urdu", "title": "Normalise", "text": "Arabic letter forms and presentation forms unified first.", "data": "normalize()", "dur": 3.4, "travel": 0.01}, {"node": "look", "via": ["norm>look"], "packet": "known words", "title": "Look up", "text": "Use a romanisation people actually wrote for this word.", "data": "transliterate_to_roman()", "dur": 3.4, "travel": 0.9}, {"node": "rules", "via": ["look>rules"], "packet": "spelled out", "title": "Letter rules", "text": "Names and rare words get the letter-by-letter mapping.", "data": "method='rules'", "dur": 3.4, "travel": 0.9}, {"node": "back", "via": ["rules>back"], "packet": "93.8% returns", "title": "Round trip", "text": "Romanise, then read it back: 93.8% of tokens return to the Urdu they started as, which is the check that it is not inventing.", "data": "transliterate_to_urdu()", "dur": 3.4, "travel": 0.9}]}</script>
