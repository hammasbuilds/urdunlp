name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # No dependencies and no models, so the matrix is free. Running it proves the
    # zero-dependency claim rather than asserting it.
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Pinned to the versions in pyproject.toml's dev group: an unpinned ruff
      # release can add a rule and fail a build nobody changed.
      - run: pip install pytest==9.1.1 ruff==0.16.7 mypy==2.3.1
      - run: ruff check src tests scripts demo.py
      - run: ruff format --check src tests scripts demo.py
      # The package ships py.typed, which promises its annotations are right.
      - run: mypy --strict src/urdunlp
      - run: pip install -e .
      - run: pytest -q
      # Every example in a docstring is run, so none can drift from the code.
      - run: pytest -q --doctest-modules src/urdunlp

  wheel:
    # An editable install reads the models straight from src/, so it cannot notice
    # a wheel that forgot them - and a wheel without its three .json.gz files
    # imports fine and fails on the first call. Build the real wheel, install it
    # somewhere src/ is not, and run the suite against that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build pytest
      - run: python -m build --wheel
      - run: pip install dist/*.whl
      - run: |
          mkdir /tmp/installed && cp -r tests /tmp/installed/
          cd /tmp/installed && python -m pytest -q -p no:cacheprovider tests
