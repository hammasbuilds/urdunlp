name: release

# Publish to PyPI when a version tag is pushed.
#
# This uses PyPI Trusted Publishing (OpenID Connect), so there is no API token
# anywhere - not in the repository, not in Actions secrets, not on anyone's
# laptop. GitHub proves the workflow's identity to PyPI directly, and PyPI only
# accepts uploads from this exact repository, workflow file and environment.
#
# A leaked token is the usual way a package gets hijacked. The safest token is
# one that does not exist.
#
# ONE-TIME SETUP, before the first tag (the publish fails without it):
#   1. https://pypi.org/manage/account/publishing/
#   2. Add a "pending publisher" with:
#        PyPI project name:  urdunlp
#        Owner:              hammasbuilds
#        Repository name:    urdunlp
#        Workflow name:      release.yml
#        Environment name:   pypi
#
# Then release with:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]
  # Lets you rehearse the build without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Never publish something the tests have not passed. A release is the one
  # moment where a broken build is permanent: PyPI does not allow re-uploading
  # a version number, even after a delete.
  test:
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The same gate as ci.yml, with the same pinned versions.
      - run: pip install pytest==9.1.1 ruff==0.16.7 mypy==2.3.1
      - run: ruff check src tests scripts demo.py
      - run: ruff format --check src tests scripts demo.py
      - run: mypy --strict src/urdunlp
      - run: pip install -e .
      - run: pytest -q
      - run: pytest -q --doctest-modules src/urdunlp

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # readme_renderer[md] is what lets `twine check` render Markdown; without it
      # the check passes a README it never parsed.
      - run: pip install build twine "readme_renderer[md]"
      - run: python -m build

      # The version in pyproject.toml must match the tag, or you publish 0.1.0
      # while believing you published 0.2.0 - and the number cannot be reused.
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag  pyproject=$version"
          test "$tag" = "$version" || { echo "::error::tag $tag != version $version"; exit 1; }

      # Catches a README that will not render on PyPI, which cannot be fixed
      # after upload without burning a version number.
      - run: twine check --strict dist/*

      - name: py.typed and the models must be in the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "urdunlp/py.typed" not in names:
              sys.exit("py.typed missing: type checkers will ignore every annotation")
          print("py.typed present")
          # Without these the package imports and then fails on its first call.
          for model in ("translit", "langid", "roman_tagger"):
              if f"urdunlp/data/{model}.json.gz" not in names:
                  sys.exit(f"{model}.json.gz missing from the wheel")
          print("bundled models present")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC token. This is what replaces the API key.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
